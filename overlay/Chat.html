        function getLuminance(r, g, b) { 
            let a = [r, g, b].map(function (v) { 
                v /= 255; 
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); 
            });

            let darkest = Math.min(lum1, lum2); 
            return (brightest + 0.05) / (darkest + 0.05);

        function formatEmotes(text, emotes) { 
            if (!emotes || emotes.length === 0) return escapeHTML(text); 
            
            emotes.sort((a, b) => b.name.length - a.name.length); 
            let htmlMap = []; 
            
            emotes.forEach((emote, index) => { 
                let url = emote.imageUrl || `https://static-cdn.jtvnw.net/emoticons/v2/${emote.id}/default/dark/2.0`; 
                let emoteHtml = `<img class="chat-emote" src="${url}" alt="${emote.name}">`; 
                htmlMap.push(emoteHtml); 
                
                let safeName = emote.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
                let regex; 
                if (/^\w/.test(emote.name) && /\w$/.test(emote.name)) regex = new RegExp(`\\b${safeName}\\b`, 'g'); 
                else regex = new RegExp(safeName, 'g'); 
                
                text = text.replace(regex, `__EMOTE_TOKEN_${index}__`); 
            }); 
            
            text = escapeHTML(text); 
            
            htmlMap.forEach((html, index) => { 
                let regex = new RegExp(`__EMOTE_TOKEN_${index}__`, 'g'); 
                text = text.replace(regex, html); 
            }); 
            return text; 
        }

        function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        const safeCmdName = escapeRegExp(CMD_NAME); 
        const safeCmdBubble = escapeRegExp(CMD_BUBBLE); 
        const safeCmdText = escapeRegExp(CMD_TEXT); 
        const safeCmdReset = escapeRegExp(CMD_RESET);
        
        const colorCmdStartRegex = new RegExp("^(" + safeCmdName + "|" + safeCmdBubble + "|" + safeCmdText + "|" + safeCmdReset + ")\\b", "i");
        const colorCmdFullRegex = new RegExp("^(" + safeCmdName + "|" + safeCmdBubble + "|" + safeCmdText + "|" + safeCmdReset + ")\\s*(#?[0-9A-Fa-f]{6}|#?[0-9A-Fa-f]{3})?", "i");

        const recentTemplateIndices = new Map();

        function pickRandomNoRepeat(key, arr, memory = 3) {
            if (!Array.isArray(arr) || arr.length === 0) return "";
            let history = recentTemplateIndices.get(key) || [];
            let candidates = arr.map((_, i) => i).filter(i => !history.includes(i));
            if (candidates.length === 0) candidates = arr.map((_, i) => i);
            const index = candidates[Math.floor(Math.random() * candidates.length)];
            history.push(index);
            while (history.length > Math.min(memory, Math.max(0, arr.length - 1))) history.shift();
            recentTemplateIndices.set(key, history);
            return arr[index];
        }

        function replaceTemplate(template, values) {
            return String(template || "").replace(/\{(\w+)\}/g, (_, key) =>
                values[key] !== undefined && values[key] !== null ? String(values[key]) : ""
            );
        }

        function currencyHTML() {
            return `<span class="currency-rainbow">${escapeHTML(KANALPUNKTE_WAEHRUNG)}</span>`;
        }

        function formatEventTemplate(template, values = {}) {
            const marker = "__CURRENCY_MARKER__";
            const safeValues = {};
            for (const [key, value] of Object.entries(values)) {
                safeValues[key] = escapeHTML(String(value ?? ""));
            }
            safeValues.currency = marker;

            let result = replaceTemplate(template, safeValues);
            result = result.split(marker).join(currencyHTML());
            return result;
        }

            if (SERIE_MEILENSTEINE[streak]) return { key: `milestone-${streak}`, pool: SERIE_MEILENSTEINE[streak], milestone: true };

            if (streak <= 9) return { key: "streak-medium", pool: SERIE_MITTEL, milestone: false };
            if (streak <= 24) return { key: "streak-large", pool: SERIE_GROSS, milestone: false };
            if (streak <= 49) return { key: "streak-extreme", pool: SERIE_EXTREM, milestone: false };
            return { key: "streak-legendary", pool: SERIE_LEGENDAER, milestone: streak === 50 || streak === 100 };
        }

        const fireworksCanvas = document.getElementById("fireworks-layer");
        const fireworksCtx = fireworksCanvas.getContext("2d");
        let fireworksParticles = [];
        let fireworksRAF = null;

        function resizeFireworksCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            fireworksCanvas.width = Math.floor(window.innerWidth * dpr);
            fireworksCanvas.height = Math.floor(window.innerHeight * dpr);
            fireworksCanvas.style.width = `${window.innerWidth}px`;
            fireworksCanvas.style.height = `${window.innerHeight}px`;
            fireworksCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        window.addEventListener("resize", resizeFireworksCanvas);
        resizeFireworksCanvas();

        function spawnFirework(x, y, intensity = 1) {
            const count = Math.round(30 + intensity * 14);
            const hue = Math.floor(Math.random() * 360);

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (1.5 + Math.random() * 3.4) * (0.8 + intensity * 0.18);
                fireworksParticles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: 0.012 + Math.random() * 0.014,
                    size: 1.2 + Math.random() * 2.2,
                    hue: (hue + Math.random() * 40 - 20 + 360) % 360,
                    gravity: 0.035 + Math.random() * 0.025
                });
            }
        }

        function renderFireworks() {
            fireworksCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            fireworksParticles = fireworksParticles.filter(p => p.life > 0.01);
            for (const p of fireworksParticles) {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.988;
                p.vy = p.vy * 0.988 + p.gravity;
                p.life -= p.decay;

                fireworksCtx.beginPath();
                fireworksCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fireworksCtx.fillStyle = `hsla(${p.hue}, 100%, 72%, ${Math.max(0, p.life)})`;
                fireworksCtx.shadowBlur = 10;
                fireworksCtx.shadowColor = `hsla(${p.hue}, 100%, 65%, ${Math.max(0, p.life)})`;
                fireworksCtx.fill();
            }

            fireworksCtx.shadowBlur = 0;

            if (fireworksParticles.length > 0) {
                fireworksRAF = requestAnimationFrame(renderFireworks);
            } else {
                fireworksCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                fireworksRAF = null;
            }
        }

        function fireworksIntensityForStreak(streak) {
            if (streak >= 100) return 3.0;
            if (streak >= 50) return 2.4;
            if (streak >= 25) return 2.0;
            if (streak >= 10) return 1.65;
            if (streak >= 5) return 1.35;
            return 1.0;
        }

        function playFireworkSound(intensity = 1) {
            if (!SERIEN_FEUERWERK_SOUND) return;

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const master = ctx.createGain();
                master.gain.value = Math.max(0, Math.min(1, SERIEN_FEUERWERK_LAUTSTAERKE));
                master.connect(ctx.destination);

                const now = ctx.currentTime;

                // kurzer "whoomp"
                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(135, now);
                osc.frequency.exponentialRampToValueAtTime(48, now + 0.22);
                oscGain.gain.setValueAtTime(0.0001, now);
                oscGain.gain.exponentialRampToValueAtTime(0.55, now + 0.012);
                oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
                osc.connect(oscGain).connect(master);
                osc.start(now);
                osc.stop(now + 0.35);

                // Crackle über gefiltertes Rauschen
                const duration = 0.75 + Math.min(0.7, intensity * 0.16);
                const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
                const channel = buffer.getChannelData(0);
                for (let i = 0; i < channel.length; i++) {
                    const envelope = Math.exp(-i / (ctx.sampleRate * 0.22));
                    channel[i] = (Math.random() * 2 - 1) * envelope;
                }

                const noise = ctx.createBufferSource();
                const filter = ctx.createBiquadFilter();
                const noiseGain = ctx.createGain();
                noise.buffer = buffer;
                filter.type = "highpass";
                filter.frequency.value = 650;
                noiseGain.gain.value = 0.34 + Math.min(0.25, intensity * 0.06);
                noise.connect(filter).connect(noiseGain).connect(master);
                noise.start(now + 0.04);
                noise.stop(now + duration + 0.05);

                setTimeout(() => {
                    try { ctx.close(); } catch (_) {}
                }, 1800);
            } catch (_) {}
        }

        function triggerStreakCelebration(streak, isMilestone = false) {
            if (!ZEIGE_SERIEN_FEUERWERK) return;

            const intensity = fireworksIntensityForStreak(streak);
            const bursts = Math.round(2 + intensity * 1.5);
            const duration = Math.max(900, SERIEN_FEUERWERK_DAUER_MS);

            const launchWave = () => {
                for (let i = 0; i < bursts; i++) {
                    setTimeout(() => {
                        // bewusst eher im rechten/zentralen Hintergrund, damit es hinter dem Chat sichtbar bleibt
                        const x = window.innerWidth * (0.22 + Math.random() * 0.64);
                        const y = window.innerHeight * (0.16 + Math.random() * 0.56);
                        spawnFirework(x, y, intensity);
                        if (!fireworksRAF) renderFireworks();
                    }, (duration / Math.max(1, bursts)) * i * 0.74);
                }

                playFireworkSound(intensity);
            };

            // Jede Zuschauerserie bekommt Feuerwerk. Ein hinterlegter Meilenstein
            // bekommt als Extra nach kurzer Pause eine zweite komplette Welle.
            launchWave();
            if (isMilestone) setTimeout(launchWave, 650);
        }

        function connectWebSocket() {
            if (isConnecting) return;
            isConnecting = true;

            if (countdownTimer) { 
                clearInterval(countdownTimer); 
                countdownTimer = null; 
            }

            ws = new WebSocket(`ws://${WS_IP}:${WS_PORT}/`);
            
            ws.onopen = () => { 
                isConnecting = false;
                
                const errorElement = document.getElementById('msg-sys-error');
                if (errorElement) executeExplosion(errorElement);
                
                ws.send(JSON.stringify({ 
                    "request": "Subscribe", 
                    "events": { 
                        "Twitch": ["ChatMessage", "ChatMessageDeleted", "ChatCleared", "UserTimedOut", "UserBanned", "RewardRedemption", "AutomaticRewardRedemption", "WatchStreak"], 
                        "YouTube": ["Message", "MessageDeleted", "ChatMessageDeleted", "UserBanned", "SuperChat"] 
                    }, 
                    "id": "MyChatOverlay" 
                })); 
                addSystemMessage(); 
            };

            ws.onerror = (error) => {
                ws.close();
            };

            ws.onclose = () => {
                isConnecting = false;
                let timeLeft = 5;
                
                showErrorBubble(timeLeft);
                
                countdownTimer = setInterval(() => {
                    timeLeft--;
                    let timerSpan = document.getElementById('reconnect-timer');
                    if (timerSpan) timerSpan.innerText = timeLeft;
                    
                    if (timeLeft <= 0) {
                        clearInterval(countdownTimer);
                        connectWebSocket();
                    }
                }, 1000);
            };

            ws.onmessage = async (event) => {
                const response = JSON.parse(event.data); 
                if (!response.event || !response.event.source) return;
                
                const source = response.event.source; 
                const type = response.event.type;
                const data = response.data || {};

                        
                
                if (source === "Twitch" && ZEIGE_TWITCH === 0) return; 
                if (source === "YouTube" && ZEIGE_YOUTUBE === 0) return;

                // Affiliate-Events werden direkt als eigene Overlay-Nachrichten dargestellt.
                if (source === "Twitch" && type === "RewardRedemption") {
                    await showRewardRedemption(data);
                    return;
                }

                if (source === "Twitch" && type === "AutomaticRewardRedemption") {
                    await showAutomaticRewardRedemption(data);
                    return;
                }

                if (source === "Twitch" && type === "WatchStreak") {
                    await showWatchStreak(data);
                    return;
                }

                if (type === "ChatCleared") { 
                    clearAllMessages(); 
                    return; 
                }
                if (type === "MessageDeleted" || type === "ChatMessageDeleted") { 
                    let targetId = data.targetMessageId || data.targetEventId || data.deletedMessageId || data.messageId || data.msgId || data.id || data.eventId || "";
                    if (!targetId && data.message) { targetId = data.message.id || data.message.messageId || data.message.eventId || ""; }
                    if (!targetId && data.event) { targetId = data.event.eventId || data.event.id || data.event.targetMessageId || ""; }
                    if (targetId) triggerExplosionById(targetId); 
                    return; 
                }
                if (type === "UserTimedOut" || type === "UserBanned") { 
                    let targetUser = (data.user && (data.user.login || data.user.name || data.user.displayName)) || 
                                     (data.author && (data.author.name || data.author.displayName)) || 
                                     data.userLogin || data.userName || data.displayName || ""; 
                    if (targetUser) triggerExplosionByUser(targetUser); 
                    return; 
                }

                let userName = "Unbekannt", msgText = "", formattedText = "", userAvatar = ""; 
                let isBroadcaster = false, isModerator = false, isVip = false, messageId = "", loginNameForFilter = "";
                let isHauptMod = false;

                try {
                    // --- TWITCH VERARBEITUNG ---
                    if (source === "Twitch" && type === "ChatMessage") {
                        const msgData = data.message || data; 
                        const userData = data.user || msgData.user || data.chatter || {};

                        messageId = msgData.id || msgData.msgId || msgData.messageId || data.id || data.messageId || "";
                        
                        // Liest Name & Login flexibel aus allen neuen/alten Strukturen aus
                        const loginName = userData.login || userData.name || userData.username || msgData.username || msgData.name || msgData.displayName || "TwitchUser"; 
                        userName = userData.displayName || userData.name || msgData.displayName || loginName; 
                        loginNameForFilter = loginName.toLowerCase(); 
                        msgText = msgData.message || msgData.text || (typeof msgData === "string" ? msgData : "");

                        // User-Input einer Kanalpunkte-Einlösung kann zusätzlich als normale
                        // ChatMessage eintreffen. Optional ausblenden, damit er nicht doppelt erscheint.
                        const messageMeta = data.meta || msgData.meta || {};
                        if (VERSTECKE_CUSTOM_REWARD_CHAT && messageMeta.isCustomReward === true) return;

                        // Badges prüfen (neu: data.user.badges / msgData.badges)
                        const badges = userData.badges || msgData.badges || data.badges || [];
                        if (Array.isArray(badges)) { 
                            isBroadcaster = badges.some(b => b.name === 'broadcaster'); 
                            isModerator = badges.some(b => b.name === 'moderator'); 
                            isVip = badges.some(b => b.name === 'vip'); 
                        } else if (msgData.isVip || userData.isVip) { 
                            isVip = true; 
                        }
                        
                        isHauptMod = HAUPT_MODS.includes(loginNameForFilter);

                        // --- DER ERWEITERTE MOD-SNIPER ---
                        if (msgText.toLowerCase().startsWith(CMD_SNIPER.toLowerCase() + " ")) {
                            if (isBroadcaster || isModerator || isHauptMod) {
                                // Teilt den Befehl in seine Wörter auf
                                let args = msgText.substring(CMD_SNIPER.length).trim().split(/\s+/);
                                if (args.length > 0 && args[0] !== "") {
                                    let firstArg = args[0];
                                    
                                    // 1. Ist das erste Wort ein User mit @? (z.B. !del @1234 oder !del @user)
                                    if (firstArg.startsWith("@")) {
                                        let target = firstArg.replace("@", "").toLowerCase();
                                        let count = (args.length > 1 && !isNaN(args[1])) ? parseInt(args[1], 10) : null;
                                        triggerExplosionByUser(target, count);
                                    } 
                                    // 2. Ist das erste Wort eine Zahl? (z.B. !del 4)
                                    else if (!isNaN(firstArg)) {
                                        triggerExplosionCount(parseInt(firstArg, 10));
                                    } 
                                    // 3. Wenn es keine Zahl ist und kein @ hat, ist es ein Username
                                    else {
                                        let target = firstArg.toLowerCase();
                                        let count = (args.length > 1 && !isNaN(args[1])) ? parseInt(args[1], 10) : null;
                                        triggerExplosionByUser(target, count);
                                    }
                                }
                            }
                            return; // Der Sniper-Befehl wird immer unsichtbar abgefangen
                        }

                        const deletedTexts = ["[message deleted]", "[message retracted]", "[message deleted by moderator]"];
                        if (deletedTexts.includes(msgText.toLowerCase())) {
                            triggerExplosionByUser(loginNameForFilter);
                            return; 
                        }

                        let shouldHide = false; 
                        for (const befehl of VERSTECKTE_BEFEHLE) { 
                            if (msgText.toLowerCase().startsWith(befehl.toLowerCase())) { shouldHide = true; break; } 
                        }

                        if (colorCmdStartRegex.test(msgText)) {
                            const match = msgText.match(colorCmdFullRegex);
                            if (match) {
                                const cmd = match[1].toLowerCase(); 
                                let hex = match[2];
                                let storageKey = ''; 
                                
                                if(cmd === CMD_NAME.toLowerCase()) storageKey = 'namefarbe'; 
                                else if(cmd === CMD_BUBBLE.toLowerCase()) storageKey = 'bubblefarbe'; 
                                else if(cmd === CMD_TEXT.toLowerCase()) storageKey = 'textfarbe';

                                if (cmd === CMD_RESET.toLowerCase()) { 
                                    delete userColorsCache[loginNameForFilter]; 
                                    localStorage.setItem('twitch_user_colors', JSON.stringify(userColorsCache)); 
                                } else if (hex && storageKey !== '') { 
                                    if (!hex.startsWith('#')) hex = '#' + hex; 
                                    saveUserColor(loginNameForFilter, storageKey, hex); 
                                }
                            }
                            shouldHide = true;
                        }
                        
                        if (shouldHide) return; 

                        const emotes = msgData.emotes || data.emotes || []; 
                        formattedText = formatEmotes(msgText, emotes); 
                        userAvatar = await getTwitchAvatarUrl(loginName, userName);
                    } 
                    // --- YOUTUBE VERARBEITUNG ---
                    else if (source === "YouTube" && (type === "Message" || type === "SuperChat")) { 
                        const ytUser = data.user || data.author || data || {};
                        
                        messageId = data.eventId || data.id || data.messageId || ""; 
                        userName = ytUser.name || data.userName || ytUser.displayName || "YouTube User"; 
                        loginNameForFilter = userName.toLowerCase(); 
                        msgText = data.message || data.textContent || ""; 
                        
                        isBroadcaster = ytUser.isOwner === true || ytUser.isChatOwner === true || data.isOwner === true; 
                        isModerator = ytUser.isModerator === true || ytUser.isChatModerator === true || data.isModerator === true; 
                        isHauptMod = HAUPT_MODS.includes(loginNameForFilter);

                        // --- DER ERWEITERTE MOD-SNIPER ---
                        if (msgText.toLowerCase().startsWith(CMD_SNIPER.toLowerCase() + " ")) {
                            if (isBroadcaster || isModerator || isHauptMod) {
                                let args = msgText.substring(CMD_SNIPER.length).trim().split(/\s+/);
                                if (args.length > 0 && args[0] !== "") {
                                    let firstArg = args[0];
                                    if (firstArg.startsWith("@")) {
                                        let target = firstArg.replace("@", "").toLowerCase();
                                        let count = (args.length > 1 && !isNaN(args[1])) ? parseInt(args[1], 10) : null;
                                        triggerExplosionByUser(target, count);
                                    } else if (!isNaN(firstArg)) {
                                        triggerExplosionCount(parseInt(firstArg, 10));
                                    } else {
                                        let target = firstArg.toLowerCase();
                                        let count = (args.length > 1 && !isNaN(args[1])) ? parseInt(args[1], 10) : null;
                                        triggerExplosionByUser(target, count);
                                    }
                                }
                            }
                            return; 
                        }

                        const deletedTexts = ["[message deleted]", "[message retracted]", "[message deleted by moderator]"];
                        if (deletedTexts.includes(msgText.toLowerCase())) {
                            triggerExplosionByUser(loginNameForFilter);
                            return; 
                        }

                        const emotes = data.emotes || []; 
                        formattedText = formatEmotes(msgText, emotes); 
                        
                        const rawAvatar = ytUser.profileImageUrl || data.profileImageUrl || "";
                        userAvatar = rawAvatar ? rawAvatar : `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=random&color=fff`; 
                    } else { 
                        return; 
                    }

                    if (!msgText || msgText.trim() === "") return; 
                    addMessageToUI(messageId, userName, formattedText, source === "YouTube", userAvatar, isBroadcaster, isModerator, isVip, loginNameForFilter, false);
                } catch (e) {}
            };
        }

        connectWebSocket();

        // --- SYSTEM-NACHRICHTEN ---
        async function addSystemMessage() { 
            try { 
                const avatar = await getTwitchAvatarUrl(SYSTEM_TWITCH_LOGIN, SYSTEM_NAME); 
                if(avatar && avatar.includes('http')) sysAvatarUrl = avatar;
                addMessageToUI('system-msg-start', SYSTEM_NAME, 'Mit Chat verbunden', false, sysAvatarUrl, false, false, false, SYSTEM_TWITCH_LOGIN, true); 
            } catch(e) {} 
        }

        async function showErrorBubble(seconds) {
            let errorWrapper = document.getElementById('msg-sys-error');
            
            if (errorWrapper) {
                let timerSpan = document.getElementById('reconnect-timer');
                if (timerSpan) timerSpan.innerText = seconds;
            } else {
                try {
                    const avatar = await getTwitchAvatarUrl(SYSTEM_TWITCH_LOGIN, SYSTEM_NAME);
                    if(avatar && avatar.includes('http')) sysAvatarUrl = avatar;
                } catch(e) {}
                
                let htmlText = `⚠️ <b>Keine Verbindung</b> ⚠️<br>
                Der Chat kann den Streamer.bot Websocket Server nicht erreichen. Bitte prüfe, ob Streamer.bot geöffnet ist und die Einstellungen stimmen:<br>
                <span style="font-family: monospace; color: #ffccaa;">WS-IP: ${WS_IP}<br>Port: ${WS_PORT}</span><br><br>
                Erneut versuchen in <b id="reconnect-timer" style="color: #ffccaa;">${seconds}</b> Sekunden`;

                addMessageToUI('sys-error', SYSTEM_NAME, htmlText, false, sysAvatarUrl, false, false, false, SYSTEM_TWITCH_LOGIN, 'error', true);
            }
        }

        // ==========================================
        //         DAS HTML-OVERLAY BAUEN
        // ==========================================
        function addMessageToUI(msgId, name, htmlText, isYT, avatar, isBroadcaster, isMod, isVip, userLogin, isSystem = false, keepAlive = false, extraClass = "") {
            const container = document.getElementById('chat-container'); 
            const wrapper = document.createElement('div'); 
            wrapper.className = 'message-wrapper'; 
            
            if(isSystem === true) wrapper.classList.add('system-msg');
            else if(isSystem === 'error') wrapper.classList.add('error-msg');

            if (extraClass) {
                extraClass.split(/\s+/).filter(Boolean).forEach(cls => wrapper.classList.add(cls));
            } 
            
            let isHauptMod = HAUPT_MODS.includes(userLogin);
            
            if(ENABLE_GLITTER && !isBroadcaster) { 
                if (isVip) wrapper.classList.add('vip-glitter'); 
                else if (isMod || isHauptMod) wrapper.classList.add('mod-glitter'); 
            }
            
            if(msgId) wrapper.id = `msg-${msgId}`; 
            if(userLogin) wrapper.setAttribute('data-username', userLogin.toLowerCase());
            
            const platformImg = isYT ? 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg' : 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg';
            
            let roleIcon = ""; 
            if (isBroadcaster) roleIcon = ICON_BROADCASTER; 
            else if (isHauptMod) roleIcon = ICON_HAUPTMOD; 
            else if (isMod) roleIcon = ICON_MOD; 
            else if (isVip) roleIcon = ICON_VIP;

            const prefs = userColorsCache[userLogin] || {}; 
            const customNameColor = prefs['namefarbe'] || DEF_NAME; 
            const customBubbleBg = prefs['bubblefarbe'] || DEF_BUB_RGBA; 
            const customTextColor = prefs['textfarbe'] || DEF_TEXT;
            
            let textShadowStyle = ''; 
            let bgCheckHex = prefs['bubblefarbe'] || DEF_BUB_HEX;  
            
            let contrast = calculateContrast(bgCheckHex, customTextColor); 
            if (contrast < 3.0) { 
                let bgRgb = hexToRgb(bgCheckHex); 
                let bgLum = bgRgb ? getLuminance(bgRgb.r, bgRgb.g, bgRgb.b) : 0; 
                let strokeColor = bgLum > 0.5 ? '#000000' : '#ffffff'; 
                textShadowStyle = `text-shadow: -2px -2px 0 ${strokeColor}, 2px -2px 0 ${strokeColor}, -2px 2px 0 ${strokeColor}, 2px 2px 0 ${strokeColor}, 0 2px 4px rgba(0,0,0,0.8);`; 
            }

            let bubbleStyle = `background: ${customBubbleBg}; color: ${customTextColor}; ${textShadowStyle}`; 
            let nameStyle = `color: ${customNameColor};`;

            wrapper.innerHTML = `
                <div class="message-content">
                    <span class="username" style="${nameStyle}">${name}</span>
                    <div class="bubble" style="${bubbleStyle}">${htmlText}</div>
                </div>
                <div class="avatar-container">
                    <img class="avatar" src="${avatar}" onerror="this.src='https://ui-avatars.com/api/?name=${name}&background=random&color=fff'">
                    <img class="platform-icon" src="${platformImg}">
                    ${roleIcon}
                </div>
            `; 
            
            container.appendChild(wrapper);

            requestAnimationFrame(() => { requestAnimationFrame(() => { wrapper.classList.add('animate-in'); }); });

            if (!keepAlive) {
                if (DAUER > 0 && !isSystem) { 
                    setTimeout(() => { 
                        if(wrapper && !wrapper.classList.contains('explode')) { 
                            wrapper.classList.add('fade-out'); 
                            wrapper.classList.remove('animate-in'); 
                            setTimeout(() => wrapper.remove(), 600); 
                        } 
                    }, DAUER * 1000); 
                } 
                else if (isSystem === true) { 
                    setTimeout(() => { 
                        if(wrapper && !wrapper.classList.contains('explode')) { 
                            wrapper.classList.add('fade-out'); 
                            wrapper.classList.remove('animate-in'); 
                            setTimeout(() => wrapper.remove(), 600); 
                        } 
                    }, 8000); 
                }
            }

            if (container.children.length > 25) { 
                const first = RICHTUNG === 1 ? container.children[0] : container.children[container.children.length - 1]; 
                if (!first.classList.contains('explode')) { 
                    first.classList.add('fade-out'); 
                    first.classList.remove('animate-in'); 
                    setTimeout(() => first.remove(), 600); 
                } 
            }
        }

        // ==========================================
        //         LÖSCH-FUNKTIONEN (Explosionen)
        // ==========================================
        function triggerExplosionById(msgId) { 
            const msgElement = document.getElementById(`msg-${msgId}`); 
            if (msgElement) executeExplosion(msgElement); 
        }
        
        // NEU: Nimmt optional einen Zähler an, um nur die letzten X Nachrichten eines Users zu löschen
        function triggerExplosionByUser(username, maxCount = null) { 
            const container = document.getElementById('chat-container'); 
            const messages = container.children; 
            const targetLower = username.toLowerCase(); 
            let deletedCount = 0;
            
            // Rückwärts durchlaufen, damit immer die NEUESTEN Nachrichten zuerst gelöscht werden
            for (let i = messages.length - 1; i >= 0; i--) { 
                if (messages[i].getAttribute('data-username') === targetLower) { 
                    executeExplosion(messages[i]); 
                    deletedCount++;
                    if (maxCount !== null && deletedCount >= maxCount) break;
                } 
            } 
        }

        // NEU: Löscht einfach blind die letzten X sichtbaren Nachrichten im Chat
        function triggerExplosionCount(maxCount) {
            const container = document.getElementById('chat-container'); 
            const messages = container.children; 
            let deletedCount = 0;
            
            for (let i = messages.length - 1; i >= 0; i--) { 
                // Schützt die Systemnachrichten (System) davor, einfach weggesprengt zu werden
                if (!messages[i].classList.contains('system-msg') && !messages[i].classList.contains('error-msg')) {
                    executeExplosion(messages[i]); 
                    deletedCount++;
                    if (deletedCount >= maxCount) break;
                }
            } 
        }
        
        function executeExplosion(element) { 
            element.classList.add('explode'); 
            element.classList.remove('animate-in'); 
            setTimeout(() => { if(element) element.remove(); }, 900); 
        }
        
        function clearAllMessages() { 
            const container = document.getElementById('chat-container'); 
            const messages = container.children; 
            for (let i = 0; i < messages.length; i++) { 
                messages[i].classList.add('explode'); 
                messages[i].classList.remove('animate-in'); 
            } 
            setTimeout(() => { container.innerHTML = ''; }, 900); 
        }
    </script>
